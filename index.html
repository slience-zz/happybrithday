<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <!-- 关键修复：强化移动端适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* 禁止页面整体滚动，交给iframe */
        }

        /* 修复iframe铺满全屏 */
        #iframepage {
            display: block;
            width: 100vw;
            height: 100vh; /* 手机屏幕满高度 */
            border: none;
        }

        /* 移动端滚动优化 */
        .iframepage {
            -webkit-overflow-scrolling: touch;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 隐藏滚动条不影响使用 */
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }

        /* 右侧悬浮按钮：手机端不遮挡、不重叠 */
        .float-btn {
            position: fixed;
            right: 8px;
            width: 32px;
            height: 32px;
            z-index: 1000;
            background: #696969;
            border-radius: 50%;
            text-align: center;
            color: #ddd;
            text-decoration: none;
            line-height: 32px;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <!-- 统一整理右侧按钮，避免重叠 -->
    <a href="https://mp.weixin.qq.com/s/oxLqXBcLCT8ij67DjkW2kw" class="float-btn" style="top: 5%;">制作</a>
    <a href="https://pan.xunlei.com/s/VNlDcB3ABz0oNSOEv5mpSE_tA1?pwd=97rw#" class="float-btn" style="top: 12%;">合集</a>
    <a href="https://drive.uc.cn/s/4819fdecb8a24" class="float-btn" style="top: 19%;">代码</a>
    <a href="https://pan.quark.cn/s/3344d23e48a8" class="float-btn" style="top: 26%;">源码</a>
    <a href="https://shop1619956412.v.weidian.com/?userid=1619956412&spider_token=2720" class="float-btn" style="top: 33%;">红包</a>

    <!-- 核心修复：iframe 全屏显示 -->
    <iframe 
        src="./html/login.html" 
        id="iframepage" 
        scrolling="yes" 
        frameborder="0"
        allowfullscreen
    ></iframe>

    <!-- 只保留一个jQuery，避免冲突 -->
    <script src="js/jquery-2.1.1.min.js"></script>

    <script>
        // 兼容部分老手机
        function changeFrameHeight() {
            let ifr = document.getElementById('iframepage');
            ifr.style.height = window.innerHeight + 'px';
        }
        window.onload = changeFrameHeight;
        window.onresize = changeFrameHeight;
    </script>
</body>

</html>
